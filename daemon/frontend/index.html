<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Neo</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body style="--wails-draggable:drag">
    <div id="app" class="container">
        <!-- Close Button (X) -->
        <div id="close-window-btn" class="close-window-btn" style="--wails-draggable:no-drag">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>

        <!-- Settings Icon -->
        <div id="settings-btn" class="settings-btn" style="--wails-draggable:no-drag">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>

        <div id="chat-history"></div>
        <div class="input-area">
            <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" placeholder="Pergunte ao Neo..." />
            <div id="mic-btn" class="mic-btn" style="--wails-draggable:no-drag">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </div>
        </div>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="settings-overlay hidden" style="--wails-draggable:no-drag">
            <div class="settings-header">
                <h3>Configurações</h3>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <span>Iniciar com o sistema</span>
                    <label class="switch">
                        <input type="checkbox" id="autostart-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Atalho de Teclado</span>
                    <div class="hotkey-inputs">
                        <button id="record-hotkey" class="record-btn">Gravar Atalho</button>
                    </div>
                </div>
                <div class="setting-item" style="margin-top: 1rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; width: 100%;">
                    <span style="font-weight: 500;">Gemini API Key</span>
                    <input type="password" id="gemini-key-input" class="gemini-key-input" placeholder="Cole sua API Key aqui..." style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; outline: none; box-sizing: border-box;" />
                </div>
                <div class="setting-item" style="margin-top: 1rem;">
                    <span>Conectar WhatsApp</span>
                    <button id="connect-whatsapp-btn" class="hotkey-btn" style="background:#25D366;color:#fff;">Ver QR Code</button>
                </div>
                <div class="setting-item" style="margin-top: 1rem;">
                    <span>Sair do Neo</span>
                    <button id="quit-neo-btn" class="hotkey-btn" style="background:#ef4444;color:#fff;">Encerrar App</button>
                </div>
                <div class="setting-msg" id="setting-msg"></div>
            </div>
        </div>
    </div>

    <!-- WhatsApp Setup Overlay -->
    <div id="whatsapp-overlay" class="whatsapp-overlay hidden" style="--wails-draggable:no-drag">
        <h2 style="margin: 0 0 1rem 0;">Conectar WhatsApp</h2>
        <p style="color: #9aa0a6; text-align: center; margin-bottom: 2rem; max-width: 80%;">Escaneie o QR Code abaixo com seu celular para vincular o Neo ao seu número.</p>
        
        <div id="qr-container" style="background: white; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; width: 256px; height: 256px; display: flex; align-items: center; justify-content: center;">
            <span id="qr-loading" style="color: #000;">Gerando QR Code...</span>
            <img id="qr-image" src="" style="display: none; width: 100%; height: 100%;" />
        </div>

        <p id="whatsapp-status-text" style="color: #fbbc04; font-weight: bold;">Aguardando conexão...</p>

        <button id="close-whatsapp-overlay" style="margin-top: 2rem; background: #3c4043; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Voltar</button>
    </div>

    <script src="./src/main.js" type="module"></script>
</body>
</html>
