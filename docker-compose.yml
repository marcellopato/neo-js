version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + Web UI (dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - BRIDGE_HOST=bridge
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/Documentos/www:/home/marcello/Documentos/www
      - ./.chroma_cache:/root/.cache
    depends_on:
      - qdrant
    restart: always

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_HOST=backend
      - NEO_PASSWORD=${NEO_PASSWORD}
    ports:
      - "3303:3303"
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    depends_on:
      - backend
    restart: always
    shm_size: 1gb
