name: Build Windows Installer (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'voice_listener.py'
      - 'email_tools.py'
      - 'tts_engine.py'
      - 'memory.py'
      - 'neo_windows_app.py'
      - 'setup_ui.html'
      - 'requirements.txt'
      - 'requirements-voice.txt'
      - 'installer/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install "google-generativeai>=0.8.0" fastapi uvicorn requests python-dotenv "gTTS==2.5.4" "edge-tts>=6.1.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-voice.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import uvicorn, fastapi, google.generativeai, edge_tts, gtts, vosk, sounddevice, pygame, win32com.client; print('ALL_IMPORTS_OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download offline PT-BR Vosk wake-word model (~31 MB)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          $zipPath = Join-Path $env:TEMP "vosk-pt.zip"
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath "models" -Force
          Rename-Item -Path "models\vosk-model-small-pt-0.3" -NewName "vosk-pt"

      - name: Build NeoAssistente.exe with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @{ commit = "${{ github.sha }}"; built_at = (Get-Date -Format "o") } | ConvertTo-Json | Set-Content -Path "build_info.json" -Encoding UTF8
          pyinstaller --noconfirm --onedir --noconsole `
            --name NeoAssistente `
            --add-data "setup_ui.html;." `
            --add-data "build_info.json;." `
            --add-data "models\vosk-pt;models\vosk-pt" `
            --collect-all vosk `
            --collect-all sounddevice `
            --collect-all edge_tts `
            --collect-data certifi `
            --collect-data grpc `
            --collect-submodules uvicorn `
            --collect-submodules fastapi `
            --collect-submodules starlette `
            --collect-submodules google.generativeai `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            neo_windows_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Neo-Assistente-Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\neo-assistente.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Assistente-Setup
          path: dist/Neo-Assistente-Setup.exe

      - name: Publish Neo-Assistente-Setup.exe to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-windows
          name: "Neo Assistente por Voz para Windows (Instalador .exe)"
          body: |
            Instalador completo com 1 clique para Windows 10/11 (**não precisa instalar Python nem usar terminal**).
            Baixe **`Neo-Assistente-Setup.exe`**, dê duplo clique e siga a tela de configuração em alto contraste.
            Commit: ${{ github.sha }}
          files: dist/Neo-Assistente-Setup.exe
          make_latest: true
